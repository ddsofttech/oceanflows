<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Story — ToolsTicker default</title>
    <link rel="stylesheet" href="../../../../web/src/styles/tokens.css" />
    <link rel="stylesheet" href="../../../../web/src/styles/marketing-tools-use-cases.css" />
    <style>
      body {
        margin: 0;
        font-family: var(--font-body);
        background: var(--color-surface-ground);
      }
    </style>
  </head>
  <body>
    <p class="visually-hidden" style="position:absolute;left:-9999px">
      Open Home via astro dev for full marquee animation.
    </p>
    <section class="tools-ticker section--flush" aria-labelledby="t1">
      <h2 id="t1" class="visually-hidden">Tools</h2>
      <div class="tools-ticker__marquee" aria-hidden="true">
        <div class="tools-ticker__track">
          <ul class="tools-ticker__list">
            <li class="tools-ticker__item"><span class="tools-ticker__label">Claude</span></li>
            <li class="tools-ticker__item"><span class="tools-ticker__label">n8n</span></li>
            <li class="tools-ticker__item"><span class="tools-ticker__label">Cursor</span></li>
          </ul>
          <ul class="tools-ticker__list" inert>
            <li class="tools-ticker__item"><span class="tools-ticker__label">Claude</span></li>
            <li class="tools-ticker__item"><span class="tools-ticker__label">n8n</span></li>
            <li class="tools-ticker__item"><span class="tools-ticker__label">Cursor</span></li>
          </ul>
        </div>
      </div>
    </section>
  </body>
</html>
