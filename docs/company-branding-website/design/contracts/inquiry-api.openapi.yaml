openapi: 3.1.0
info:
  title: DD Software Solutions — Inquiry API
  version: 1.0.0
  description: >-
    Sole server-side behavior for the company branding website (NFR-05).
    Delivers visitor inquiries to the designated inbox; never persists inquiry data in a database.
servers:
  - url: https://{host}
    variables:
      host:
        default: example.netlify.app
        description: Netlify deploy host (staging or production)
paths:
  /api/inquiry:
    post:
      operationId: submitInquiry
      summary: Submit a contact inquiry
      description: >-
        Validates input, runs spam checks (BR-07, NFR-06). On spam, returns 200 with
        rejected=true and no email delivery (visitor must not see success — handled by the client).
        On success, sends email to INQUIRY_EMAIL and returns sent=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryRequest"
            examples:
              valid:
                value:
                  name: Jane SMB
                  email: jane@example.com
                  phone: "+1-555-0100"
                  message: "We want help automating intake forms."
                  hp: ""
      responses:
        "200":
          description: Processed (includes intentional spam rejection without error code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "502":
          description: Upstream email delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
components:
  schemas:
    InquiryRequest:
      type: object
      additionalProperties: false
      required: [name, email, message, hp]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        message:
          type: string
          minLength: 1
          maxLength: 5000
        hp:
          type: string
          maxLength: 0
          description: Honeypot; must be empty for humans
    InquiryResponse:
      type: object
      required: [sent, rejected]
      properties:
        sent:
          type: boolean
          description: true when email was delivered to the inbox
        rejected:
          type: boolean
          description: true when classified as spam (no delivery, no client success UI)
    ValidationError:
      type: object
      required: [error, fields]
      properties:
        error:
          type: string
          const: validation_failed
        fields:
          type: object
          additionalProperties:
            type: string
          description: Field name to human-readable error message
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [rate_limited, delivery_failed, server_error]
        message:
          type: string