name = "oceanflows-company-site"
main = "./dist/_worker.js/index.js"
compatibility_date = "2024-11-01"
upload_source_maps = true

[assets]
binding = "ASSETS"
directory = "./dist"

[observability]
enabled = true

# Per-email daily inquiry counters (inquiry-email-daily-limit, ADR-5).
# Owner: set production id (+ preview_id) before deploy — SETUP-GUIDES.md §A8.
[[kv_namespaces]]
binding = "INQUIRY_DAILY_LIMIT"
id = "<production-namespace-id>"
preview_id = "<preview-namespace-id>"
