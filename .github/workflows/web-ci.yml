name: web-ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: true

jobs:
  format:
    name: gate / format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run format
        working-directory: web

  lint:
    name: gate / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run lint
        working-directory: web

  types:
    name: gate / types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run check
        working-directory: web

  duplication:
    name: gate / duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run jscpd
        working-directory: web

  unused:
    name: gate / unused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run knip
        working-directory: web

  audit:
    name: gate / dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run audit:gate
        working-directory: web

  sast:
    name: gate / sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run lint
        working-directory: web

  secrets:
    name: gate / secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: gate / unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run test:coverage
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install diff-cover
      - name: Resolve compare branch
        id: cov
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=origin/${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          git fetch origin "${{ steps.cov.outputs.branch }}" || true
          diff-cover web/coverage/lcov.info \
            --compare-branch="${{ steps.cov.outputs.branch }}" \
            --fail-under=80
        working-directory: .

  e2e:
    name: gate / playwright-smoke
    runs-on: ubuntu-latest
    needs: [types]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npx playwright install chromium --with-deps
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          PUBLIC_CF_ANALYTICS_TOKEN: e2e-test-beacon-token
      - run: npm run test:e2e
        working-directory: web

  placeholders:
    name: gate / build-placeholders
    runs-on: ubuntu-latest
    needs: [types]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run build && npm run check:placeholders
        working-directory: web

  stylelint:
    name: gate / design-tokens-stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run stylelint
        working-directory: web

  ui-catalog:
    name: gate / ui-catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ui-catalog check
        run: |
          python .cursor/sdlc/scripts/ui-catalog.py \
            --src web/src/components \
            --tokens design/tokens/design-tokens.json \
            --check

  sdlc-process:
    name: gate / sdlc-process
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .cursor/sdlc/scripts/sdlc-check.py
