name: web-ci

on:
  pull_request:
  push:
    branches:
      - main
      - ux/company-branding-website
      - release/tools-ticker-use-cases
      - 'feature/**'

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: true
  WORKING_DIR: web
  REQUEST: company-branding-website
  BASE_BRANCH: origin/ux/company-branding-website

jobs:
  format:
    name: gate / format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run format
        working-directory: web

  lint:
    name: gate / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run lint
        working-directory: web

  types:
    name: gate / types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run check
        working-directory: web

  duplication:
    name: gate / duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run jscpd
        working-directory: web

  unused:
    name: gate / unused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run knip
        working-directory: web

  audit:
    name: gate / dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run audit:gate
        working-directory: web

  sast:
    name: gate / sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run lint
        working-directory: web

  secrets:
    name: gate / secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: gate / unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run test:coverage
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install diff-cover
      - name: Resolve compare branch
        id: cov
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
          else
            BASE="${{ github.ref_name }}"
          fi
          case "$BASE" in
            *tools-ticker-use-cases*)
              echo "branch=origin/release/tools-ticker-use-cases" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "branch=origin/ux/company-branding-website" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - run: |
          git fetch origin "${{ steps.cov.outputs.branch }}" || true
          diff-cover web/coverage/lcov.info \
            --compare-branch="${{ steps.cov.outputs.branch }}" \
            --fail-under=80
        working-directory: .

  e2e:
    name: gate / playwright-smoke
    runs-on: ubuntu-latest
    needs: [types]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npx playwright install chromium --with-deps
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          PUBLIC_CF_ANALYTICS_TOKEN: e2e-test-beacon-token
      - run: npm run test:e2e
        working-directory: web

  placeholders:
    name: gate / build-placeholders
    runs-on: ubuntu-latest
    needs: [types]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run build && npm run check:placeholders
        working-directory: web

  stylelint:
    name: gate / design-tokens-stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
        working-directory: web
      - run: npm run stylelint
        working-directory: web

  ui-catalog:
    name: gate / ui-catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ui-catalog check
        run: |
          # Production catalog: Astro components only (prototype/ is S2 throwaway, not on release).
          python .cursor/sdlc/scripts/ui-catalog.py \
            --src web/src/components \
            --tokens design/tokens/design-tokens.json \
            --check

  sdlc-process:
    name: gate / sdlc-process
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve SDLC request (G-CI-01)
        id: sdlc
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
          else
            BASE="${{ github.ref_name }}"
          fi
          case "$BASE" in
            *tools-ticker-use-cases*)
              echo "request=tools-ticker-use-cases" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "request=company-branding-website" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - run: python .cursor/sdlc/scripts/sdlc-check.py --request ${{ steps.sdlc.outputs.request }}

  change-size:
    name: gate / change-size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve SDLC request and part (G-CI-01)
        id: sdlc
        run: |
          BASE_REF="${{ github.base_ref }}"
          HEAD_REF="${{ github.head_ref }}"
          case "$BASE_REF" in
            *tools-ticker-use-cases*)
              REQUEST=tools-ticker-use-cases
              case "$HEAD_REF" in
                feature/ttuc-*)
                  PART="${HEAD_REF#feature/}"
                  ;;
                *)
                  PART=ttuc-fe-01
                  ;;
              esac
              ;;
            *)
              REQUEST=company-branding-website
              PART=cbw-fe-01
              ;;
          esac
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          echo "part=$PART" >> "$GITHUB_OUTPUT"
      - run: |
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "$BASE_REF" || true
          python .cursor/sdlc/scripts/sdlc-check.py \
            --request ${{ steps.sdlc.outputs.request }} \
            --part ${{ steps.sdlc.outputs.part }} \
            --base "origin/$BASE_REF"